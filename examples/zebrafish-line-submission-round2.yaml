name: Submit a Line
description: ""
pages:
- pageNumber: 0
  title: Notice
- pageNumber: 1
  title: General Info
- pageNumber: 2
  title: Mutations
- pageNumber: 3
  title: Linked Features
- pageNumber: 4
  title: Line Background
- pageNumber: 5
  title: Additional Information
elements:
- type: STATIC_TEXT
  label: Notice
  fieldName: static_notice_description
  sortOrder: 0
  configuration:
    content: "<p>Description of the form</p>\n\n<p>Before proceeding make sure you\
      \ have the information for all features in the line. Please include genetic/genomic\
      \ features present in a line background (e.g., known background mutations and/or\
      \ known background transgenes).</p>\n"
  pageIndex: 0
- type: STATIC_TEXT
  label: Line Information
  fieldName: static_text_1771882818043
  sortOrder: 1
  configuration:
    content: <p>General information about the line (for fish, not alleles and features)</p>
  pageIndex: 1
- type: STATIC_TEXT
  label: Line Name — ZFIN mapping note
  fieldName: static_line_name_zfin_note
  sortOrder: 2
  configuration:
    content: "<aside style=\"border-left:4px solid #f59e0b;background:#fffbeb;color:#78350f;padding:0.5rem\
      \ 0.75rem;margin:0.5rem 0;border-radius:0.25rem;font-size:0.875rem;\"><strong>✨\
      \ Stakeholder note \xB7 TODO:</strong> Line Name is equivalent to a synonym\
      \ for fish on the ZFIN side.</aside>"
  pageIndex: 1
- type: TEXT_INPUT
  label: Line Name
  fieldName: line_name
  sortOrder: 3
  configuration:
    placeholder: Enter text...
    required: false
  pageIndex: 1
- type: STATIC_TEXT
  label: Line Name — submission requirement note
  fieldName: static_line_name_note
  sortOrder: 4
  configuration:
    content: "<aside style=\"border-left:4px solid #f59e0b;background:#fffbeb;color:#78350f;padding:0.5rem\
      \ 0.75rem;margin:0.5rem 0;border-radius:0.25rem;font-size:0.875rem;\"><strong>✨\
      \ Stakeholder note \xB7 TODO:</strong> Line Name is not required to fill in\
      \ fields, but is required before submitting for review.</aside>"
  pageIndex: 1
- type: TEXT_AREA
  label: Previous Line Names
  fieldName: previous_line_names
  sortOrder: 5
  configuration:
    placeholder: Enter text...
  pageIndex: 1
- type: CHECKBOX_GROUP
  label: Reasons why ZIRC should accept line
  fieldName: reasons_to_accept
  sortOrder: 6
  configuration:
    options:
    - label: Currently frequently requested
      value: frequently_requested
    - label: Expect high demand
      value: expect_high_demand
    - label: Interesting gene
      value: interesting_gene
    - label: Community resource/tool
      value: community_resource
    - label: Mutant gene cloned
      value: mutant_gene_cloned
    - label: Danger of losing line
      value: danger_of_losing
    - label: Lack of space or funding to maintain line
      value: lack_of_space_or_funding
    allowOther: true
  pageIndex: 1
- type: ELEMENT_GROUP
  label: Mutations
  fieldName: mutations
  sortOrder: 7
  configuration:
    repeatable: true
    minInstances: 0
    maxInstances: 5
    fullPage: true
    instanceLabel: Mutation
  pageIndex: 2
  children:
  - type: ELEMENT_GROUP
    label: Mutation General Info
    fieldName: mutation_general_info
    sortOrder: 0
    configuration:
      repeatable: false
      fullPage: true
    pageIndex: 2
    children:
    - type: CHECKBOX
      label: Does this allele designation exist in ZFIN?
      fieldName: allele_exists_in_zfin
      sortOrder: 0
      configuration:
        content: <p><em>If not, this submission will be flagged for ZFIN curator
          review.</em></p>
      pageIndex: 2
    - type: TEXT_INPUT
      label: Allele designation assigned to the mutation
      fieldName: allele_designation_zfin
      sortOrder: 1
      configuration:
        placeholder: Autocomplete from ZFIN — shown when allele exists in ZFIN
      pageIndex: 2
    - type: TEXT_INPUT
      label: Allele designation (free text)
      fieldName: allele_designation_freetext
      sortOrder: 2
      configuration:
        placeholder: Free text — shown when allele does not exist in ZFIN
      pageIndex: 2
    - type: SELECT
      label: Mutagenesis stage
      fieldName: mutagenesis_stage
      sortOrder: 3
      configuration:
        options:
        - label: not specified
          value: not_specified
        - label: adult females
          value: adult_females
        - label: adult males
          value: adult_males
        - label: embryos
          value: embryos
        - label: sperm
          value: sperm
        allowOther: true
      pageIndex: 2
    - type: SELECT
      label: Mutagen
      fieldName: mutagenesis_protocol
      sortOrder: 4
      configuration:
        options:
        - label: not specified
          value: not_specified
        - label: CRISPR
          value: crispr
        - label: EMS
          value: ems
        - label: ENU
          value: enu
        - label: g-rays
          value: g_rays
        - label: spontaneous
          value: spontaneous
        - label: TALEN
          value: talen
        - label: TMP
          value: tmp
        - label: zinc finger nuclease
          value: zinc_finger_nuclease
        allowOther: true
      pageIndex: 2
    - type: RADIO_GROUP
      label: Is the mutation molecularly characterized/cloned?
      fieldName: mutation_molecularly_characterized
      sortOrder: 5
      configuration:
        options:
        - label: "Yes"
          value: "yes"
        - label: "No"
          value: "no"
      pageIndex: 2
    - type: STATIC_TEXT
      label: Uncloned mutation note
      fieldName: static_uncloned_mutation
      sortOrder: 6
      configuration:
        content: <p><em>If the mutation is not molecularly characterized, additional
          fields (e.g., SSLP markers) will be requested. Requirements TBD.</em></p>
      pageIndex: 2
    - type: RADIO_GROUP
      label: Is ZFIN record established for this mutation?
      fieldName: zfin_record_established
      sortOrder: 7
      configuration:
        options:
        - label: "Yes"
          value: "yes"
        - label: "No"
          value: "no"
      pageIndex: 2
    - type: TEXT_INPUT
      label: "ZDB genomic feature # (ZFIN ID)"
      fieldName: zdb_genomic_feature
      sortOrder: 8
      configuration:
        placeholder: Shown when ZFIN record is established
      pageIndex: 2
    - type: TEXT_INPUT
      label: Mutation discoverer/creator
      fieldName: mutation_discoverer
      sortOrder: 9
      configuration:
        placeholder: Enter text...
      pageIndex: 2
    - type: TEXT_INPUT
      label: Institution where the mutation was discovered/generated
      fieldName: mutation_institution
      sortOrder: 10
      configuration:
        placeholder: Enter text...
      pageIndex: 2
    - type: TEXT_INPUT
      label: Publications (please list)
      fieldName: publications
      sortOrder: 11
      configuration:
        placeholder: Enter text...
        repeatable: true
        minInstances: 0
        maxInstances: 10
      pageIndex: 2
  - type: ELEMENT_GROUP
    label: Genes
    fieldName: genes
    sortOrder: 1
    configuration:
      repeatable: true
      minInstances: 0
      maxInstances: 10
      fullPage: true
      instanceLabel: Gene
      trackCompletion: true
    pageIndex: 2
    children:
    - type: TEXT_INPUT
      label: Mutated gene
      fieldName: mutated_gene
      sortOrder: 0
      configuration:
        placeholder: Autocomplete from ZFIN
      pageIndex: 2
    - type: TEXT_INPUT
      label: Linkage group
      fieldName: linkage_group
      sortOrder: 1
      configuration:
        placeholder: Autocomplete (chromosome)
      pageIndex: 2
    - type: TEXT_INPUT
      label: "GenBank accession # for genomic DNA"
      fieldName: genbank_genomic_dna
      sortOrder: 2
      configuration:
        placeholder: Validated against NCBI (not ZFIN-only)
      pageIndex: 2
    - type: TEXT_INPUT
      label: "GenBank accession # for cDNA"
      fieldName: genbank_cdna
      sortOrder: 3
      configuration:
        placeholder: Validated against NCBI
      pageIndex: 2
    - type: STATIC_TEXT
