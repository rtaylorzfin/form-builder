      sortOrder: 11
      configuration:
        placeholder: e.g. 300
      pageIndex: 2
    - type: TEXT_AREA
      label: Additional information
      fieldName: assay_additional_info
      sortOrder: 12
      configuration:
        placeholder: "Enter text... (For SSLP, list multiple genes here.)"
      pageIndex: 2
  - type: ELEMENT_GROUP
