        - label: "Hypermorphic (gain of function, increased activity)"
          value: hypermorphic
        - label: "Neomorphic (gain of function, new function)"
          value: neomorphic
        - label: Unknown
          value: unknown
        allowOther: true
      pageIndex: 2
  - type: ELEMENT_GROUP
