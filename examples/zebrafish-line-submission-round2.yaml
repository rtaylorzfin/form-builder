        - label: High-Resolution Melt Analysis (HRMA)
          value: hrma
        - label: Simple Sequence Length Polymorphism (SSLP)
          value: sslp
        allowOther: true
      pageIndex: 2
    - type: STATIC_TEXT
      label: Assay attachment
      fieldName: static_assay_upload
      sortOrder: 1
      configuration:
        content: "<h4>Attachment</h4>\n<p>Upload a chromatogram or other supporting\
          \ file (file upload component pending — backend support required). Size\
          \ limit applies.</p>\n"
      pageIndex: 2
    - type: TEXT_AREA
      label: Attachment description
      fieldName: assay_attachment_description
      sortOrder: 2
      configuration:
        placeholder: Describe the uploaded file
      pageIndex: 2
    - type: TEXT_INPUT
      label: Forward primer
      fieldName: forward_primer
      sortOrder: 3
      configuration:
        placeholder: 5'-...
        pattern: "^[ACTGNactgn]+$"
        patternMessage: Only A, C, T, G, and N characters are allowed
      pageIndex: 2
    - type: TEXT_INPUT
      label: Reverse primer
      fieldName: reverse_primer
      sortOrder: 4
      configuration:
        placeholder: 5'-...
        pattern: "^[ACTGNactgn]+$"
        patternMessage: Only A, C, T, G, and N characters are allowed
      pageIndex: 2
    - type: TEXT_INPUT
      label: Expected wild-type PCR product(s) (bp)
      fieldName: expected_wt_pcr
      sortOrder: 5
      configuration:
        placeholder: e.g. 413
      pageIndex: 2
    - type: TEXT_INPUT
      label: Expected mutant PCR product(s) (bp)
      fieldName: expected_mut_pcr
      sortOrder: 6
      configuration:
        placeholder: e.g. 300
      pageIndex: 2
    - type: TEXT_INPUT
