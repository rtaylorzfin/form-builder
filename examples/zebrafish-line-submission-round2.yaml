name: Submit a Line
description: ""
pages:
- pageNumber: 0
  title: Notice
- pageNumber: 1
  title: General Info
- pageNumber: 2
  title: Mutations
- pageNumber: 3
  title: Linked Features
- pageNumber: 4
  title: Line Background
- pageNumber: 5
  title: Additional Information
elements:
- type: STATIC_TEXT
  label: Notice
  fieldName: static_notice_description
  sortOrder: 0
  configuration:
    content: "<p>Description of the form</p>\n\n<p>Before proceeding make sure you\
      \ have the information for all features in the line. Please include genetic/genomic\
      \ features present in a line background (e.g., known background mutations and/or\
      \ known background transgenes).</p>\n"
  pageIndex: 0
- type: STATIC_TEXT
  label: Line Information
  fieldName: static_text_1771882818043
  sortOrder: 1
  configuration:
    content: <p>General information about the line (for fish, not alleles and features)</p>
  pageIndex: 1
- type: TEXT_INPUT
  label: Line Name
  fieldName: line_name
  sortOrder: 2
  configuration:
    placeholder: Enter text (equivalent to synonym for fish on ZFIN side)...
    required: false
  pageIndex: 1
- type: STATIC_TEXT
  label: Line Name Note
  fieldName: static_line_name_note
  sortOrder: 3
  configuration:
    content: <p><em>Line Name is not required to fill in fields, but is required
      before submitting for review.</em></p>
  pageIndex: 1
- type: TEXT_AREA
  label: Previous Line Names
  fieldName: previous_line_names
  sortOrder: 4
  configuration:
    placeholder: Enter text...
  pageIndex: 1
- type: CHECKBOX_GROUP
  label: Reasons why ZIRC should accept line
  fieldName: reasons_to_accept
  sortOrder: 5
  configuration:
    options:
    - label: Currently frequently requested
      value: frequently_requested
    - label: Expect high demand
      value: expect_high_demand
    - label: Interesting gene
      value: interesting_gene
    - label: Community resource/tool
      value: community_resource
    - label: Mutant gene cloned
      value: mutant_gene_cloned
    - label: Danger of losing line
      value: danger_of_losing
    - label: Lack of space or funding to maintain line
      value: lack_of_space_or_funding
    allowOther: true
  pageIndex: 1
- type: ELEMENT_GROUP
  label: Mutations
  fieldName: mutations
  sortOrder: 6
  configuration:
    repeatable: true
    minInstances: 0
    maxInstances: 5
    fullPage: true
    instanceLabel: Mutation
  pageIndex: 2
  children:
  - type: ELEMENT_GROUP
    label: Mutation General Info
    fieldName: mutation_general_info
    sortOrder: 0
    configuration:
      repeatable: false
      fullPage: true
    pageIndex: 2
    children:
    - type: CHECKBOX
      label: Does this allele designation exist in ZFIN?
      fieldName: allele_exists_in_zfin
      sortOrder: 0
      configuration:
        content: <p><em>If not, this submission will be flagged for ZFIN curator
          review.</em></p>
      pageIndex: 2
    - type: TEXT_INPUT
      label: Allele designation assigned to the mutation
      fieldName: allele_designation_zfin
      sortOrder: 1
      configuration:
        placeholder: Autocomplete from ZFIN — shown when allele exists in ZFIN
      pageIndex: 2
    - type: TEXT_INPUT
      label: Allele designation (free text)
      fieldName: allele_designation_freetext
      sortOrder: 2
      configuration:
        placeholder: Free text — shown when allele does not exist in ZFIN
      pageIndex: 2
    - type: SELECT
      label: Mutagenesis stage
      fieldName: mutagenesis_stage
      sortOrder: 3
      configuration:
        options:
        - label: not specified
          value: not_specified
        - label: adult females
          value: adult_females
        - label: adult males
          value: adult_males
        - label: embryos
          value: embryos
        - label: sperm
          value: sperm
        allowOther: true
      pageIndex: 2
    - type: SELECT
      label: Mutagen
      fieldName: mutagenesis_protocol
      sortOrder: 4
      configuration:
        options:
        - label: not specified
          value: not_specified
        - label: CRISPR
          value: crispr
        - label: EMS
          value: ems
        - label: ENU
          value: enu
        - label: g-rays
          value: g_rays
        - label: spontaneous
          value: spontaneous
        - label: TALEN
          value: talen
        - label: TMP
          value: tmp
        - label: zinc finger nuclease
          value: zinc_finger_nuclease
        allowOther: true
      pageIndex: 2
    - type: RADIO_GROUP
      label: Is the mutation molecularly characterized/cloned?
      fieldName: mutation_molecularly_characterized
      sortOrder: 5
      configuration:
        options:
        - label: "Yes"
          value: "yes"
        - label: "No"
          value: "no"
      pageIndex: 2
    - type: STATIC_TEXT
      label: Uncloned mutation note
      fieldName: static_uncloned_mutation
      sortOrder: 6
      configuration:
        content: <p><em>If the mutation is not molecularly characterized, additional
          fields (e.g., SSLP markers) will be requested. Requirements TBD.</em></p>
      pageIndex: 2
    - type: RADIO_GROUP
      label: Is ZFIN record established for this mutation?
      fieldName: zfin_record_established
      sortOrder: 7
      configuration:
        options:
        - label: "Yes"
          value: "yes"
        - label: "No"
          value: "no"
      pageIndex: 2
    - type: TEXT_INPUT
      label: "ZDB genomic feature # (ZFIN ID)"
      fieldName: zdb_genomic_feature
      sortOrder: 8
      configuration:
        placeholder: Shown when ZFIN record is established
      pageIndex: 2
    - type: TEXT_INPUT
      label: Mutation discoverer/creator
      fieldName: mutation_discoverer
      sortOrder: 9
      configuration:
        placeholder: Enter text...
      pageIndex: 2
    - type: TEXT_INPUT
      label: Institution where the mutation was discovered/generated
      fieldName: mutation_institution
      sortOrder: 10
      configuration:
        placeholder: Enter text...
      pageIndex: 2
    - type: TEXT_INPUT
      label: Publications (please list)
      fieldName: publications
      sortOrder: 11
      configuration:
        placeholder: Enter text...
        repeatable: true
        minInstances: 0
        maxInstances: 10
      pageIndex: 2
  - type: ELEMENT_GROUP
    label: Genes
    fieldName: genes
    sortOrder: 1
    configuration:
      repeatable: true
      minInstances: 0
      maxInstances: 10
      fullPage: true
      instanceLabel: Gene
      trackCompletion: true
    pageIndex: 2
    children:
    - type: TEXT_INPUT
      label: Mutated gene
      fieldName: mutated_gene
      sortOrder: 0
      configuration:
        placeholder: Autocomplete from ZFIN
      pageIndex: 2
    - type: TEXT_INPUT
      label: Linkage group
      fieldName: linkage_group
      sortOrder: 1
      configuration:
        placeholder: Autocomplete (chromosome)
      pageIndex: 2
    - type: TEXT_INPUT
      label: "GenBank accession # for genomic DNA"
      fieldName: genbank_genomic_dna
      sortOrder: 2
      configuration:
        placeholder: Validated against NCBI (not ZFIN-only)
      pageIndex: 2
    - type: TEXT_INPUT
      label: "GenBank accession # for cDNA"
      fieldName: genbank_cdna
      sortOrder: 3
      configuration:
        placeholder: Validated against NCBI
      pageIndex: 2
    - type: STATIC_TEXT
      label: Single gene assumption
      fieldName: static_single_gene_note
      sortOrder: 4
      configuration:
        content: <p><em>In most cases with a single gene and a single mutation, an
          'is allele of' relationship is assumed.</em></p>
      pageIndex: 2
    - type: CHECKBOX
      label: Gene Section Complete
      fieldName: gene_section_complete
      sortOrder: 5
      configuration: {}
      pageIndex: 2
  - type: ELEMENT_GROUP
    label: Lesions
    fieldName: lesions
    sortOrder: 2
    configuration:
      repeatable: true
      minInstances: 0
      maxInstances: 10
      fullPage: true
      instanceLabel: Lesion
    pageIndex: 2
    children:
    - type: RADIO_GROUP
      label: Lesion Type
      fieldName: lesion_type
      sortOrder: 0
      configuration:
        options:
        - label: Point mutation
          value: point_mutation
        - label: Deletion
          value: deletion
        - label: Insertion
          value: insertion
        - label: Indel (delins)
          value: indel
        - label: Transgene
          value: transgene
        - label: Unknown
          value: unknown
        allowOther: true
      pageIndex: 2
    - type: STATIC_TEXT
      label: Molecular Nature of the Lesion
      fieldName: static_lesion_molecular
      sortOrder: 1
      configuration:
        content: "<h4>More information about the molecular nature of the lesion</h4>\n\
          <p><em>The fields shown below depend on the Lesion Type selected above.</em></p>\n"
      pageIndex: 2
    - type: NUMBER
      label: Indel (delins) deletion size (bp)
      fieldName: indel_deletion_size
      sortOrder: 2
      configuration:
        placeholder: Enter number...
      pageIndex: 2
    - type: NUMBER
      label: Indel (delins) insertion size (bp)
      fieldName: indel_insertion_size
      sortOrder: 3
      configuration:
        placeholder: Enter number...
      pageIndex: 2
    - type: TEXT_INPUT
      label: Deleted base pairs
      fieldName: deleted_base_pairs
      sortOrder: 4
      configuration:
        placeholder: e.g. TTAT
      pageIndex: 2
    - type: TEXT_INPUT
      label: Inserted base pairs (replaced with)
      fieldName: inserted_base_pairs
      sortOrder: 5
      configuration:
        placeholder: e.g. GTCATTTATTTAAA
      pageIndex: 2
    - type: TEXT_INPUT
      label: Location of mutated nucleotide(s) in WT genomic sequence
      fieldName: wt_genomic_sequence
      sortOrder: 6
      configuration:
        placeholder: "Please list at least 5 nucleotides preceding and following.\
          \ e.g. ccgccgc[TTAT]tgacagtg"
      pageIndex: 2
    - type: TEXT_INPUT
      label: Location of mutated nucleotide(s) in mutant genomic sequence
      fieldName: mut_genomic_sequence
      sortOrder: 7
      configuration:
        placeholder: "e.g. ccgccgc[GTCATTTATTTAAA]tgacagtg"
      pageIndex: 2
    - type: TEXT_INPUT
      label: Mutated amino acid(s) — free text
      fieldName: mutated_amino_acids_freetext
      sortOrder: 8
      configuration:
        placeholder: Free-text description of the effect on the protein
      pageIndex: 2
    - type: TEXT_INPUT
      label: Mutated amino acid(s) — HGVS.P nomenclature
      fieldName: mutated_amino_acids_hgvs
      sortOrder: 9
      configuration:
        placeholder: "e.g. p.Phe173Cys, p.Phe173fsTer6 (see HGVS.P documentation)"
      pageIndex: 2
    - type: STATIC_TEXT
      label: Transgenic Insertion
      fieldName: static_transgenic_insertion
      sortOrder: 10
      configuration:
        content: "<h4>Transgenic Insertion</h4>\n<p><em>The fields below apply when\
          \ Lesion Type is Transgene.</em></p>\n"
      pageIndex: 2
    - type: NUMBER
      label: Transgene size (bp)
      fieldName: transgene_size
      sortOrder: 11
      configuration:
        placeholder: Automatically calculated from the transgene sequence
      pageIndex: 2
    - type: TEXT_AREA
      label: Sequence of the transgene
      fieldName: transgene_sequence
      sortOrder: 12
      configuration:
        placeholder: Paste the transgene sequence
      pageIndex: 2
    - type: TEXT_INPUT
      label: 5' genomic region nucleotides that directly precede the transgene
      fieldName: transgene_5prime_flank
      sortOrder: 13
      configuration:
        placeholder: e.g. atcctggatgaggcatccatggaaagtggaagtgatgta
      pageIndex: 2
    - type: TEXT_INPUT
      label: 3' genomic region nucleotides that directly follow the transgene
      fieldName: transgene_3prime_flank
      sortOrder: 14
      configuration:
        placeholder: e.g. ctgggattcatccaccatggttatcaccaagaatggtgta
      pageIndex: 2
    - type: TEXT_INPUT
      label: GenBank accession for the transgene
      fieldName: transgene_genbank_accession
      sortOrder: 15
      configuration:
        placeholder: Validated against NCBI
      pageIndex: 2
    - type: TEXT_AREA
      label: Additional information
      fieldName: lesion_additional_info
      sortOrder: 16
      configuration:
        placeholder: Enter any additional information about this lesion...
      pageIndex: 2
  - type: ELEMENT_GROUP
    label: Genotyping Assays
    fieldName: genotyping_assays
    sortOrder: 3
    configuration:
      repeatable: true
      minInstances: 0
      maxInstances: 10
      fullPage: true
      instanceLabel: Assay
    pageIndex: 2
    children:
    - type: RADIO_GROUP
      label: Type of Assay
      fieldName: assay_type
      sortOrder: 0
      configuration:
        options:
        - label: PCR followed by gel electrophoresis
          value: pcr_gel
        - label: PCR followed by sequencing
          value: pcr_sequencing
        - label: Restriction Fragment Length Polymorphism (RFLP)
          value: rflp
        - label: Derived Cleaved Amplified Polymorphic Sequences (dCAPS)
